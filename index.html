{"word": "evacuate", "root": "vac", "meaning": "疏散；撤离"}, {"word": "vacuum", "root": "vac", "meaning": "真空；吸尘器"}]}, {"id": "cred-fic-scenes", "title": "cred / fic", "order": 8, "status": "ready", "description": "辨别可信与轻信，比较足够、熟练、高效和缺乏；保留正确历史词族。", "roots": [{"id": "cred", "label": "cred · 相信", "meaning": "相信"}, {"id": "fic", "label": "fic · 做（历史词族）", "meaning": "做（历史词族）"}], "wordCount": 9, "coreWordCount": 9, "supplementWordCount": 0, "href": "courses/cred-fic/output/lesson.html", "words": [{"word": "credit", "root": "cred", "meaning": "信用；学分"}, {"word": "credible", "root": "cred", "meaning": "可信的"}, {"word": "incredible", "root": "cred", "meaning": "难以置信的；惊人的"}, {"word": "credulous", "root": "cred", "meaning": "轻信的"}, {"word": "creed", "root": "cred", "meaning": "信条；信仰"}, {"word": "sufficient", "root": "fic", "meaning": "足够的"}, {"word": "proficient", "root": "fic", "meaning": "熟练的；精通的"}, {"word": "efficient", "root": "fic", "meaning": "高效的"}, {"word": "deficient", "root": "fic", "meaning": "不足的；缺乏的"}]}, {"id": "nov-dur-scenes", "title": "nov / dur", "order": 9, "status": "ready", "description": "新想法、旧物翻新与持续时间：从具体变化理解词义。", "roots": [{"id": "nov", "label": "nov · 新", "meaning": "新"}, {"id": "dur", "label": "dur · 持久", "meaning": "持久"}], "wordCount": 7, "coreWordCount": 7, "supplementWordCount": 0, "href": "courses/nov-dur/output/lesson.html", "words": [{"word": "novel", "root": "nov", "meaning": "新颖的；小说（名词）"}, {"word": "novice", "root": "nov", "meaning": "新手；初学者"}, {"word": "innovate", "root": "nov", "meaning": "创新；采用新方法"}, {"word": "renovate", "root": "nov", "meaning": "翻新；修复"}, {"word": "durable", "root": "dur", "meaning": "耐用的"}, {"word": "endure", "root": "dur", "meaning": "忍受；持续"}, {"word": "duration", "root": "dur", "meaning": "持续时间"}]}, {"id": "tend-vis-scenes", "title": "tend / vis", "order": 10, "status": "ready", "description": "看方向怎样伸展、注意力怎样指向，再用视觉检查与修改。", "roots": [{"id": "tend", "label": "tend · 伸展 / 指向", "meaning": "伸展 / 指向"}, {"id": "vis", "label": "vis ·   <script>(() => {
  'use strict';
  const $=id=>document.getElementById(id);
  const recentKey='english-root-project:last-course:v1';
  let catalog;
  try{catalog=JSON.parse($('catalog-data').textContent);}catch{$('empty-state').hidden=false;$('empty-title').textContent='课程目录暂时无法读取';$('empty-copy').textContent='请重新生成课程目录后打开。';return;}
  const courses=(Array.isArray(catalog.courses)?catalog.courses:[]).slice().sort((a,b)=>(Number(a.order)||0)-(Number(b.order)||0)||String(a.id).localeCompare(String(b.id)));
  const ready=course=>course.status==='ready'&&typeof course.href==='string'&&course.href.length>0&&!/^(?:[a-z][a-z\d+.-]*:|\/|\\)/i.test(course.href);
  const clean=text=>String(text??'').normalize('NFKC').toLocaleLowerCase().trim();
  const available=courses.filter(ready);
  const rootIds=new Set(available.flatMap(c=>(c.roots||[]).map(r=>r.id)));
  const node=(tag,text,className)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(className)n.className=className;return n;};
  let filter='all';
  const title=typeof catalog.title==='string'&&catalog.title.trim()?catalog.title:'英语词根学习';
  $('project-title').textContent=title;document.title=title+' · 课程目录';
  $('course-count').textContent=String(available.length);$('root-count').textContent=String(rootIds.size);$('word-count').textContent=String(available.reduce((sum,c)=>sum+(Number(c.wordCount)||0),0));

  function hrefFor(course,parameters={}){
    const [base,hash]=course.href.split('#',2);const query=new URLSearchParams(parameters).toString();
    return base+(query?(base.includes('?')?'&':'?')+query:'')+(hash?'#'+hash:'');
  }
  function remember(course){try{localStorage.setItem(recentKey,course.id);}catch{}}
  function link(course,text,className,parameters){const a=node('a',text,className);a.href=hrefFor(course,parameters);a.addEventListener('click',()=>remember(course));return a;}
  let lastId=null;try{lastId=localStorage.getItem(recentKey);}catch{}
  const recent=available.find(c=>c.id===lastId);
  if(recent){$('recent-course').hidden=false;$('recent-title').textContent=recent.title;$('recent-link').href=hrefFor(recent);$('recent-link').addEventListener('click',()=>remember(recent));}
  const entries=courses.map(course=>({course,haystack:clean([course.title,course.description,...(course.roots||[]).flatMap(r=>[r.id,r.label,r.meaning]),...(course.words||[]).flatMap(w=>[w.word,w.meaning,w.root])].join(' '))}));
  function termsFor(query){return clean(query).split(/\s+/).filter(Boolean);}
  function matchesWords(course,terms){if(!terms.length)return[];return(course.words||[]).filter(w=>{const text=clean([w.word,w.meaning,w.root].join(' '));return terms.every(term=>text.includes(term));});}
  function card(course,terms){
    const usable=ready(course),article=node('article',undefined,'course-card');article.dataset.courseId=String(course.id);
    const top=node('div',undefined,'course-top');top.append(node('span','课程 '+String(course.order??'—').padStart(2,'0'),'course-order'));
    top.append(node('span',usable?'可学习':course.status==='draft'?'制作中':'待制作','status-badge'+(usable?'':' pending')));article.append(top,node('h3',course.title));
    if(course.description)article.append(node('p',course.description,'description'));
    const roots=node('div',undefined,'root-links');roots.setAttribute('aria-label','本课程词根');
    for(const root of course.roots||[]){const item=usable?link(course,undefined,'root-link',{root:root.id}):node('span',undefined,'root-link pending');item.append(node('span',root.label?.split('·')[0]?.trim()||root.id,'root-name'),node('span',root.meaning||root.label?.split('·').slice(1).join('·').trim()||'','root-meaning'));if(usable)item.setAttribute('aria-label','打开词根 '+root.id+' 的课程');roots.append(item);}
    article.append(roots);
    if(usable){const core=Number(course.coreWordCount)||0,supplement=Number(course.supplementWordCount)||0,count=Number(course.wordCount)||0;let meta=count+' 个词条';if(core||supplement)meta+=' · 核心 '+core+(supplement?' ＋ 补充 '+supplement:'');article.append(node('p',meta,'course-meta'));}
    else article.append(node('p',course.status==='draft'?'课程内容正在制作，准备完成后即可打开。':'这组材料尚未制作，完成后会出现在这里。','course-meta'));
    const matched=matchesWords(course,terms);
    if(matched.length){const group=node('div',undefined,'word-matches');group.append(node('p','匹配的单词','word-matches-title'));const list=node('div',undefined,'word-match-list');for(const word of matched.slice(0,6)){const item=usable?link(course,word.word,'word-match',{word:word.word,stage:'scene'}):node('span',word.word,'word-match pending');if(usable)item.setAttribute('aria-label','打开 '+word.word+' 的情景');list.append(item);}group.append(list);if(matched.length>6)group.append(node('p','另有 '+(matched.length-6)+' 个匹配词，可缩小搜索范围。','more-matches'));article.append(group);}
    const bottom=node('div',undefined,'card-bottom');if(usable){const open=link(course,'打开课程','action');open.append(node('span','→'));open.setAttribute('aria-label','打开课程 '+course.title);bottom.append(open);}else{const disabled=node('button','尚未开放','unavailable');disabled.type='button';disabled.disabled=true;bottom.append(disabled);}article.append(bottom);return article;
  }
  function render(){
    const query=$('course-search').value,terms=termsFor(query);$('clear-search').hidden=!query.length;
    const result=entries.filter(({course,haystack})=>(filter==='all'||(filter==='ready'?ready(course):!ready(course)))&&terms.every(term=>haystack.includes(term))).map(x=>x.course);
    const fragment=document.createDocumentFragment();result.forEach(c=>fragment.append(card(c,terms)));$('course-grid').replaceChildren(fragment);$('empty-state').hidden=result.length>0;
    const readyCount=result.filter(ready).length;$('result-summary').textContent=(terms.length?'找到 ':'共 ')+result.length+' 组课程'+(result.length?' · '+readyCount+' 组可学习':'');
    if(!result.length){$('empty-title').textContent=!courses.length?'课程目录还是空的':terms.length?'没有找到相符的课程':filter==='pending'?'目前没有待制作课程':'目前没有可学习课程';$('empty-copy').textContent=!courses.length?'添加课程并更新目录后，会显示在这里。':terms.length?'试试词根、中文含义，或换一个单词。':filter==='pending'?'已加入目录的课程都已准备好。':'课程准备完成后，就可以从这里选择。';}
  }
  $('search-form').addEventListener('submit',event=>{event.preventDefault();render();});
  $('course-search').addEventListener('input',render);
  $('clear-search').addEventListener('click',()=>{$('course-search').value='';render();$('course-search').focus();});
  document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{filter=button.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));render();}));
  render();
})();
</script>
