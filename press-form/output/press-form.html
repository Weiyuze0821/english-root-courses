  const root=document.getElementById('engine-host')||document.body;
  const canvas=document.createElement('canvas');canvas.width=1200;canvas.height=600;
  const ctx=canvas.getContext('2d');let index=0,p=.06,palette;
  const mix = (a,b,t) => {
    const rgb=s=>s.match(/[\d.]+/g)?.slice(0,3).map(Number) || [128,128,128];
    const x=rgb(a),y=rgb(b); return 'rgb('+x.map((v,i)=>Math.round(v+(y[i]-v)*t)).join(',')+')';
  };
  function colors() {
    const probe=document.createElement('span'); root.append(probe);
    const resolve=(v,fallback)=>{probe.style.color='var('+v+','+fallback+')'; return getComputedStyle(probe).color;};
    const fg=resolve('--foreground','CanvasText'), bg=resolve('--background','Canvas');
    palette={fg,bg,orange:resolve('--orange','Highlight'),mint:resolve('--green','Highlight'),blue:resolve('--blue','Highlight'),purple:resolve('--purple','Highlight'),yellow:resolve('--yellow','Highlight'),red:resolve('--red','Highlight'),soft:mix(bg,fg,.08),dim:mix(bg,fg,.45)};
    probe.remove();
  }
  const ease=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t);};
  const phase=(a,b)=>ease((p-a)/(b-a));
  function line(x1,y1,x2,y2,color=palette.fg,width=3){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineWidth=width;ctx.strokeStyle=color;ctx.lineCap='round';ctx.stroke();}
  function box(x,y,w,h,fill,r=10,stroke=true){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=3;ctx.strokeStyle=palette.fg;ctx.stroke();}}
  function circle(x,y,r,fill,stroke=true){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=palette.fg;ctx.lineWidth=3;ctx.stroke();}}
  function label(s,x,y,size=27,color=palette.fg){ctx.font='500 '+size+'px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=color;ctx.fillText(s,x,y);}
  function arrow(x1,y1,x2,y2,color=palette.dim){line(x1,y1,x2,y2,color,4);const a=Math.atan2(y2-y1,x2-x1);line(x2,y2,x2-12*Math.cos(a-.5),y2-12*Math.sin(a-.5),color,4);line(x2,y2,x2-12*Math.cos(a+.5),y2-12*Math.sin(a+.5),color,4);}
  function person(x,y,color=palette.mint,pose='happy',scale=1){
    ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
    line(-16,28,-22,46);line(16,28,22,46);
    line(-31,3,-45,pose==='up'?-23:17);line(31,3,46,pose==='up'?-27:17);
    ctx.beginPath();ctx.ellipse(0,0,35,37,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=palette.fg;ctx.stroke();
    ctx.beginPath();ctx.moveTo(-4,-36);ctx.quadraticCurveTo(-9,-53,13,-48);ctx.quadraticCurveTo(15,-39,-4,-36);ctx.fillStyle=color;ctx.fill();ctx.stroke();
    circle(-11,-3,3.2,palette.fg,false);circle(11,-3,3.2,palette.fg,false);
    ctx.beginPath();ctx.strokeStyle=palette.fg;ctx.lineWidth=2.8;
    if(pose==='no'){ctx.moveTo(-8,15);ctx.lineTo(8,15);}else if(pose==='sad'||pose==='angry'){ctx.arc(0,23,10,Math.PI+.15,2*Math.PI-.15);}else{ctx.arc(0,7,10,.15,Math.PI-.15);}
    ctx.stroke();ctx.restore();

  <script>(() => {
  'use strict';
  const engine=window.rootSceneRenderer,course=engine.getData();
  const $=id=>document.getElementById(id),audio=$('local-narration'),canvas=$('local-scene'),ctx=canvas.getContext('2d');
  const stages=[['anchor','词根锚点'],['scene','情景例句'],['affixes','前后缀'],['family','词族变化'],['story','串联短文'],['review','回顾表']];
  const wordStages=new Set(['scene','affixes','family']);
  const storeKey='english-scenes-local:'+course.id+':v1';
  let saved={};try{saved=JSON.parse(localStorage.getItem(storeKey)||'{}');}catch{}
  const state={index:0,stage:'anchor',chinese:true,...saved};
  state.index=Math.max(0,Math.min(course.words.length-1,Number(state.index)||0));
  const query=new URLSearchParams(location.search);let deepLinked=false;
  const requestedRoot=course.roots.find(r=>r.id===query.get('root'));
  if(requestedRoot){state.index=course.words.findIndex(w=>w.root===requestedRoot.id);state.stage='anchor';deepLinked=true;}
  const requestedWord=course.words.findIndex(w=>w.word.toLowerCase()===(query.get('word')||'').trim().toLowerCase());
  if(requestedWord>=0){state.index=requestedWord;state.stage='scene';deepLinked=true;}
  if(stages.some(s=>s[0]===query.get('stage'))){state.stage=query.get('stage');deepLinked=true;}
  if(deepLinked){try{const clean=new URL(location.href);for(const name of ['root','word','stage'])clean.searchParams.delete(name);history.replaceState(history.state,'',clean.href);}catch{}}
  if(!stages.some(s=>s[0]===state.stage))state.stage='anchor';
  state.chinese=state.chinese!==false;
  if(state.stage==='family'&&!course.words[state.index].family)state.stage='affixes';
  let playing=false,raf=null,progress=0,started=0,playDuration=5,clipId=null,token=0,visualIndex=-1;
  const rootFor=()=>course.roots.find(r=>r.id===course.words[state.index].root);
  const rootWords=()=>course.words.map((w,index)=>({w,index})).filter(x=>x.w.root===rootFor().id);
  const stageName=()=>stages.find(x=>x[0]===state.stage)[1];
  function save(){try{localStorage.setItem(storeKey,JSON.stringify({index:state.index,stage:state.stage,chinese:state.chinese}));}catch{}}
  function node(tag,text,className){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(className)n.className=className;return n;}
  function stop(){token++;playing=false;if(raf!==null)cancelAnimationFrame(raf);raf=null;audio.pause();$('play').setAttribute('aria-pressed','false');$('play').textContent='播放原速朗读';}
  function currentClip(){const w=course.words[state.index],r=rootFor();if(state.stage==='anchor')return r.narration?.intro?.id||null;if(state.stage==='story')return r.narration?.story?.id||null;if(state.stage==='review')return null;if(state.stage==='family')return w.family?.audioId||null;return w.word;}
  function setAudio(){const id=currentClip();if(id!==clipId){audio.pause();audio.removeAttribute('src');if(id){const source=engine.getAudio(id);if(source)audio.src=source;}audio.load();clipId=id;}audio.playbackRate=1;audio.defaultPlaybackRate=1;audio.dataset.clipId=id||'';}
  function draw(value){if($('scene-wrap').hidden)return;const w=course.words[state.index],r=rootFor();const words=rootWords(),anchor=words.find(x=>x.w.word===(r.anchorWord||r.id))||words[0];const index=state.stage==='anchor'?anchor.index:state.index;if(visualIndex!==index){engine.select(index);visualIndex=index;}const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const source=engine.frame(reduced?1:value);ctx.clearRect(0,0,1200,600);ctx.drawImage(source,0,0,1200,600);canvas.setAttribute('aria-label',state.stage==='anchor'?r.anchor:w.sceneAlt);}
  function play(restart=false){
    if(playing&&!restart){stop();return;}
    if(!currentClip())return;
    stop();setAudio();if(restart||progress>=.999||audio.ended){progress=0;audio.currentTime=0;}
    const myToken=++token;playing=true;$('play').textContent='暂停';$('play').setAttribute('aria-pressed','true');$('status').textContent='';
    const duration=Number.isFinite(audio.duration)&&audio.duration>0?audio.duration:5;
    playDuration=(state.stage==='scene'||state.stage==='anchor')?Math.max(4.8,duration+.5):duration+.3;
    started=performance.now()-progress*playDuration*1000;
    if(!audio.ended)audio.play().catch(error=>{if(myToken!==token||!playing)return;stop();$('status').textContent=error.name==='NotAllowedError'?'点击“播放原速朗读”即可开始。':'这段朗读未能播放，可以先阅读当前内容。';});
    function tick(now){if(!playing||myToken!==token)return;progress=Math.min(1,(now-started)/(playDuration*1000));draw(progress);$('progress-fill').style.width=(progress*100)+'%';if(progress<1){raf=requestAnimationFrame(tick);}else{playing=false;raf=null;$('play').setAttribute('aria-pressed','false');$('play').textContent='再播放一次';$('status').textContent='原速朗读完成';}}
    raf=requestAnimationFrame(tick);
  }
  function go(index,stage,autoplay=true,scroll=false){stop();state.index=index;state.stage=stage;if(stage==='family'&&!course.words[index].family)state.stage='affixes';progress=0;render();save();if(autoplay)play(true);if(scroll)$('stage-nav').scrollIntoView({block:'start',behavior:'auto'});}
  function switchRoot(id){go(course.words.findIndex(w=>w.root===id),'anchor');}
  function markedSentence(text,w){const p=node('p');const re=new RegExp('('+w.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[a-z]*)','gi');let at=0;for(const match of text.matchAll(re)){p.append(document.createTextNode(text.slice(at,match.index)),node('mark',match[0]));at=match.index+match[0].length;}p.append(document.createTextNode(text.slice(at)));return p;}
  function chinese(text,parent){const p=node('p',text,'chinese');p.dataset.chinese='true';p.hidden=!state.chinese;parent.append(p);}
  function callout(label,text,parent){const box=node('div',undefined,'callout');box.append(node('div',label,'callout-label'),node('p',text));parent.append(box);}
  function rootNavigation(){const root=rootFor(),words=rootWords();$('root-buttons').replaceChildren();for(const r of course.roots){const b=node('button',undefined,'root-button');b.type='button';b.setAttribute('aria-pressed',String(r.id===root.id));b.append(node('strong',r.id),node('span',r.label.split('·').slice(1).join('·').trim()));b.addEventListener('click',()=>switchRoot(r.id));$('root-buttons').append(b);}
    $('word-list').replaceChildren();$('word-select').replaceChildren();words.forEach(({w,index},position)=>{const b=node('button',undefined,'word-button');b.type='button';b.setAttribute('aria-current',String(index===state.index&&wordStages.has(state.stage)));b.append(node('span',String(position+1).padStart(2,'0'),'word-no'),node('span',w.word,'word-name'));if(w.origin==='笔记补充词')b.append(node('span','补充','supplement'));b.addEventListener('click',()=>go(index,'scene'));$('word-list').append(b);const option=node('option',w.word+(w.origin==='笔记补充词'?' · 笔记补充':''));option.value=index;$('word-select').append(option);});$('word-select').value=String(state.index);
  }
  function projectNavigation(){const project=course.project,section=$('project-course-section');if(!project){section.hidden=true;return;}section.hidden=false;$('project-catalog-link').href=project.catalogHref;const select=$('project-root-select');select.replaceChildren();for(const entry of project.courses){const group=node('optgroup');group.label=entry.title;for(const r of entry.roots){const option=node('option',r.label+(entry.status==='ready'?'':' · 待制作'));option.value=entry.href?entry.href+'?root='+encodeURIComponent(r.id):'';option.dataset.course=entry.id;option.dataset.root=r.id;option.disabled=entry.status!=='ready'||!entry.href;option.selected=entry.id===course.id&&r.id===rootFor().id;group.append(option);}select.append(group);}}
  function stageNavigation(){const w=course.words[state.index];$('stage-nav').replaceChildren();stages.forEach(([key,label],i)=>{const b=node('button',undefined,'stage-button');b.type='button';b.dataset.stage=key;if(key===state.stage)b.setAttribute('aria-current','step');b.disabled=key==='family'&&!w.family;b.append(node('span',String(i+1).padStart(2,'0'),'stage-no'),node('span',label));b.addEventListener('click',()=>go(state.index,key));$('stage-nav').append(b);});}
  function storyContent(root,container){const p=node('p',undefined,'story-english');const words=rootWords().map(x=>x.w.word).sort((a,b)=>b.length-a.length);const re=new RegExp('\\b('+words.join('|')+')[a-z]*\\b','gi');let at=0;for(const match of root.story.matchAll(re)){p.append(document.createTextNode(root.story.slice(at,match.index)));const base=words.find(word=>match[0].toLowerCase().startsWith(word.toLowerCase()));const b=node('button',match[0],'story-word');b.type='button';b.setAttribute('aria-label','打开 '+base+' 的情景');b.addEventListener('click',()=>go(course.words.findIndex(w=>w.word===base),'scene',true,true));p.append(b);at=match.index+match[0].length;}p.append(document.createTextNode(root.story.slice(at)));container.append(p);chinese(root.storyZh,container);callout('小提示','点击短文中标出的单词，可以回到对应情景。',container);}
  function reviewContent(container){const wrap=node('div',undefined,'table-wrap'),table=node('table',undefined,'review'),head=node('thead'),tr=node('tr');for(const title of ['单词','词义','拆分线索']){const th=node('th',title);th.scope='col';tr.append(th);}head.append(tr);table.append(head);const body=node('tbody');for(const {w,index} of rootWords()){const row=node('tr'),name=node('td'),meaning=node('td',w.meaning),parts=node('td',w.morphemes.map(x=>x.text+'（'+x.meaning+'）').join('＋'),'decomp');const b=node('button',w.word);b.type='button';b.addEventListener('click',()=>go(index,'scene',true,true));name.append(b);if(w.origin==='笔记补充词')name.append(node('div','笔记补充','small'));row.append(name,meaning,parts);body.append(row);}table.append(body);wrap.append(table);container.append(wrap);}
  function render(){const w=course.words[state.index],root=rootFor(),words=rootWords(),position=words.findIndex(x=>x.index===state.index)+1;rootNavigation();projectNavigation();stageNavigation();$('course-subtitle').textContent=course.roots.map(r=>r.id).join(' / ');document.title=course.title+' · 本地学习';$('eyebrow').textContent=root.label+' / '+stageName()+(wordStages.has(state.stage)?' / '+position+' of '+words.length:'');$('chinese').checked=state.chinese;$('status').textContent='';$('progress-fill').style.width='0%';$('play').disabled=state.stage==='review';$('replay').disabled=state.stage==='review';$('play').textContent=state.stage==='review'?'点击单词回到情景':'播放原速朗读';$('origin').textContent=wordStages.has(state.stage)?w.origin:'本词根';
    const showScene=state.stage==='scene'||state.stage==='anchor';$('scene-wrap').hidden=!showScene;$('scene-caption').textContent=state.stage==='anchor'?root.anchor:'记忆线索：'+w.cue;$('stage-content').style.marginTop=showScene?'22px':'0';const content=$('stage-content');content.replaceChildren();
    if(state.stage==='anchor'){$('stage-title').textContent=root.id;$('stage-subtitle').textContent=root.label.split('·').slice(1).join('·').trim();content.append(node('p',root.narration?.intro?.speech||root.anchor,'anchor-english'));}
    if(state.stage==='scene'){$('stage-title').textContent=w.word;$('stage-subtitle').textContent=w.meaning;const block=node('div',undefined,'english');w.lines.forEach(line=>block.append(markedSentence(line,w)));content.append(block);chinese(w.zh.join(' '),content);}
    if(state.stage==='affixes'){$('stage-title').textContent=w.word;$('stage-subtitle').textContent='看每个部分怎样影响整个词的意思';const parts=node('div',undefined,'parts'),roles={prefix:'前缀',root:'词根',suffix:'后缀',ending:'拼写 / 历史词尾',combining:'组合成分'};w.morphemes.forEach(part=>{const box=node('div',undefined,'part');box.dataset.role=part.role;box.append(node('span',roles[part.role]||'成分','part-role'),node('span',(part.role==='prefix'?part.text+'-':part.role==='suffix'?'-'+part.text:part.text),'part-text'),node('span',part.meaning,'part-meaning'));parts.append(box);});content.append(parts);callout('把拆分放回画面',w.cue,content);content.append(node('p',w.morphNote,'morph-note'));callout('常用搭配',w.extra,content);}
    if(state.stage==='family'){const f=w.family;$('stage-title').textContent=w.word;$('stage-subtitle').textContent='词族变化 · 把词尾和用法一起记';content.append(node('p',w.word+' → '+f.word,'family-title'),node('p',f.pos),node('p',f.suffix,'family-suffix'));callout('拼写怎样变化',f.spelling,content);content.append(node('p',f.example,'family-example'));}
    if(state.stage==='story'){$('stage-title').textContent='把词连起来';$('stage-subtitle').textContent='在同一段情景里再次遇见这些词';storyContent(root,content);}
    if(state.stage==='review'){$('stage-title').textContent='回顾这一组';$('stage-subtitle').textContent='查漏与回想；点击单词可跳回情景';reviewContent(content);}
    $('next-step').textContent=nextLabel();$('step-hint').textContent=stageName()+' · 随时可跳转';setAudio();draw(.06);
  }
  function nextLabel(){const words=rootWords(),at=words.findIndex(x=>x.index===state.index);if(state.stage==='review')return'下一词根 →';if(state.stage==='story')return'进入回顾表 →';if(state.stage==='family'||(state.stage==='affixes'&&!course.words[state.index].family))return at===words.length-1?'串联短文 →':'下一个词 →';return'下一阶段 →';}
  function nextStep(){const words=rootWords(),at=words.findIndex(x=>x.index===state.index);if(state.stage==='anchor')return go(words[0].index,'scene');if(state.stage==='scene')return go(state.index,'affixes');if(state.stage==='affixes'&&course.words[state.index].family)return go(state.index,'family');if(state.stage==='family'||state.stage==='affixes')return at<words.length-1?go(words[at+1].index,'scene'):go(state.index,'story');if(state.stage==='story')return go(state.index,'review',false);const ri=course.roots.indexOf(rootFor());switchRoot(course.roots[(ri+1)%course.roots.length].id);}
  function previousStep(){const words=rootWords(),at=words.findIndex(x=>x.index===state.index);if(state.stage==='review')return go(state.index,'story');if(state.stage==='story'){const last=words.at(-1);return go(last.index,last.w.family?'family':'affixes');}if(state.stage==='family')return go(state.index,'affixes');if(state.stage==='affixes')return go(state.index,'scene');if(state.stage==='scene')return at?go(words[at-1].index,words[at-1].w.family?'family':'affixes'):go(state.index,'anchor');const ri=course.roots.indexOf(rootFor()),r=course.roots[(ri-1+course.roots.length)%course.roots.length];go(course.words.findIndex(w=>w.root===r.id),'review',false);}
  function moveWord(direction){go((state.index+direction+course.words.length)%course.words.length,'scene');}
  $('word-select').addEventListener('change',()=>go(Number($('word-select').value),'scene'));
  $('project-root-select').addEventListener('change',()=>{const option=$('project-root-select').selectedOptions[0];if(!option||option.disabled||!option.value)return;if(option.dataset.course===course.id)switchRoot(option.dataset.root);else location.href=option.value;});
  $('previous-word').addEventListener('click',()=>moveWord(-1));
  $('next-word').addEventListener('click',()=>moveWord(1));
  $('previous-step').addEventListener('click',previousStep);$('next-step').addEventListener('click',nextStep);
  $('play').addEventListener('click',()=>play());$('replay').addEventListener('click',()=>play(true));
  $('chinese').addEventListener('change',()=>{state.chinese=$('chinese').checked;document.querySelectorAll('[data-chinese]').forEach(n=>n.hidden=!state.chinese);save();});
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'){stop();return;}
    if(event.defaultPrevented||event.isComposing||event.repeat||!['ArrowLeft','ArrowRight'].includes(event.key))return;
    const target=event.target;
    if(target instanceof Element&&(target.isContentEditable||target.closest('textarea,select,[role="textbox"],[role="combobox"],[role="slider"],[role="spinbutton"],input:not([type="checkbox"]):not([type="button"]):not([type="submit"]):not([type="reset"])')))return;
    if(event.ctrlKey||event.altKey||event.shiftKey)return;
    event.preventDefault();
    if(event.metaKey)moveWord(event.key==='ArrowRight'?1:-1);
    else if(event.key==='ArrowRight')nextStep();
    else previousStep();
  });document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
  render();if(deepLinked)save();
})();
</script>
